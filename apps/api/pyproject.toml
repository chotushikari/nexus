[project]
name = "nexus-api"
version = "0.1.0"
description = "NEXUS FastAPI backend and Google ADK host."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "google-adk>=2.0.0,<3.0.0",
  "google-cloud-firestore>=2.29.0",
  "google-genai>=1.0.0",
  "opentelemetry-api>=1.30.0",
  "opentelemetry-sdk>=1.30.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "python-dotenv>=1.0.1",
  "uvicorn[standard]>=0.34.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.9.0"
]

# NOTE: pytest configuration lives in the repo-root `pytest.ini` only.
# A `[tool.pytest.ini_options]` block here used to declare a conflicting
# `testpaths`, which meant `pytest` behaved differently depending on the
# directory it was launched from. Do not reintroduce it.

[tool.ruff]
line-length = 100
target-version = "py313"

