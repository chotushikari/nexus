apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: nexus-api
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
    spec:
      containerConcurrency: 10
      timeoutSeconds: 300
      containers:
        - image: us-central1-docker.pkg.dev/PROJECT_ID/nexus/api:latest
          resources:
            limits:
              cpu: "1"
              memory: "512Mi"
          env:
            - name: GOOGLE_CLOUD_PROJECT
              value: PROJECT_ID
            - name: GOOGLE_CLOUD_LOCATION
              value: us-central1
            - name: FIRESTORE_DATABASE
              value: nexus-db

