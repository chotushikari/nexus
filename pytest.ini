[pytest]
testpaths = tests

# ── collection ──────────────────────────────────────────────────────────────
# Collect BOTH naming conventions. The previous value (`sprint_*.py` only)
# silently excluded every `test_*.py` file in tests/, so four suites — the agent
# registry, the end-to-end mission, the policy engine and the security block —
# were never collected and never ran. Do not narrow this again.
#
# `tests/manual_verify.py` is a standalone stdlib-only runner, not a pytest
# module; it deliberately matches none of these patterns.
python_files = test_*.py *_test.py sprint_*.py
python_classes = Test*
python_functions = test_*

# `nexus_api` lives under apps/api rather than at the repo root, so make it
# importable without a sys.path hack. tests/conftest.py also inserts it, so
# `pytest tests/test_x.py` works from any working directory.
pythonpath = apps/api

# ── async ───────────────────────────────────────────────────────────────────
# Missions run in background asyncio tasks, so most orchestration tests are
# `async def`. `auto` mode means they need no per-test decorator.
# Requires pytest-asyncio (declared in apps/api[dev]).
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# ── markers ─────────────────────────────────────────────────────────────────
markers =
    integration: requires real credentials or network (Gemini, ADK, Firestore); skipped by default

# ── output ──────────────────────────────────────────────────────────────────
# `--strict-markers` turns a typo'd marker into an error. `--strict-config` is
# deliberately NOT used: it would turn `asyncio_mode` into a hard error on a
# machine where pytest-asyncio is missing, which is a worse failure mode than a
# warning.
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning
