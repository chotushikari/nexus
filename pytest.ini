[pytest]
testpaths = tests
# Collect BOTH naming conventions. The previous value (`sprint_*.py` only)
# silently excluded every `test_*.py` file in tests/, so four suites never ran.
python_files = test_*.py *_test.py sprint_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    integration: requires real credentials or network (Gemini, ADK, Firestore); skipped by default
filterwarnings =
    ignore::DeprecationWarning
