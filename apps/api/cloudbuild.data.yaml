steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.cloudrun.data
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/nexus/api:latest
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/nexus/api:latest
images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/nexus/api:latest

